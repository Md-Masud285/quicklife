name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build QuickLife Android App (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: ⚙️ Install Capacitor CLI & Android Platform
        run: |
          npm install --save @capacitor/core @capacitor/android @capacitor/cli

      - name: 🔨 Build Production Web Assets
        run: npm run build

      - name: 📱 Add & Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🏗️ Build Direct Installable APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease || true

      - name: 🛒 Build Play Store App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease || true

      - name: 📤 Upload Direct Installable APK (quicklife-app.apk)
        uses: actions/upload-artifact@v4
        with:
          name: QuickLife-Direct-Installable-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📤 Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: QuickLife-PlayStore-Bundle-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
          retention-days: 30
